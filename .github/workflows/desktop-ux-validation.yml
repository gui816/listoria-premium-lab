name: Temporary desktop UX build validation
on:
  push:
    branches: [feat/desktop-shopping-experience]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
